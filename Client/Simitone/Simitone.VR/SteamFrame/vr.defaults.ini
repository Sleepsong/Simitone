# Defaults for the Steam Frame (standalone, Snapdragon 8 Gen 3). Copied next to the executable by
# build-steamframe.sh. Per-user overrides go in vr.ini in the Simitone user folder (~/Documents/Simitone/
# or ~/Simitone/), which is written on first run.
#
# The lot is drawn once for both eyes when the graphics driver supports OpenGL multiview (SinglePassStereo),
# and foveated rendering draws the edges of your view at lower resolution, following your eyes (the Frame
# tracks them). Start a little under the recommended per-eye resolution; raise towards 1.0 if your lot holds
# the headset's frame rate.
RenderScale=0.75
SinglePassStereo=True
Foveation=Light
UpdateRate=90
MirrorEye=None
